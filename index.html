<body>
    <style>
        html {
          background-color: black;
          color: white;
          font-family: pointfree bold;
        }
        @font-face {
            font-family: pointfree bold;
            src: url(/fonts/pointfree-bold.ttf)
        }
        h1 {
            text-shadow: 0 4px 1px #f888, 0 8px 2px #f004;
            animation: rainbow-shadows 5s linear infinite;
        }
        @keyframes rainbow-shadows {
            0%, 100% {
                text-shadow: 0 4px 1px #f888, 0 8px 2px #f004;
            }
            16% {
                text-shadow: 0 4px 1px #ff88, 0 8px 2px #ff04;
            }
            33% {
                text-shadow: 0 4px 1px #8f88, 0 8px 2px #0f04;
            }
            50% {
                text-shadow: 0 4px 1px #8ff8, 0 8px 2px #0ff4;
            }
            66% {
                text-shadow: 0 4px 1px #88f8, 0 8px 2px #00f4;
            }
            83% {
                text-shadow: 0 4px 1px #f8f8, 0 8px 2px #f0f4;
            }
        }
        link {
          color: #34A6E0;
        }
        .ok {
            width: fit-content;
            display: inline-block
        }
    </style>
    <h1 id="mypage">Welcome to my page!!</h1>
    <div>I am a 13 year old furry who does random stuff :3</div>
    <h2>Websites: </h2>
    <a href="https://d3ltastorm.github.io/power-calc">Abbreviation Calculator</a>
    <script>
        function wabver(text,incrmente,time) {
        	let result = "";
        	for (let i in text) {
        		switch (text[i]) {
        			case " ":
        				result += ` `
        				break;
        			default:
        				result += `<div style="transform: translateY(${Math.sin((i*incrmente+time)*Math.PI)*6}px)" class="ok">${text[i]}</div>`
        		}
        	};
        	return result
        };
        setInterval(_=>{
            document.getElementById("mypage").innerHTML = wabver("Welcome to my page!!",0.1,performance.now()/2000)
        },33)
    </script>
