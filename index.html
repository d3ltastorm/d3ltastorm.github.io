    <a href="https://d3ltastorm.github.io/power-calc">Abbreviation Calculator</a>
    <script>
        function wabver(text,incrmente,time) {
        	let result = "";
        	for (let i in text) {
        		switch (text[i]) {
        			case " ":
        				result += ` `
        				break;
        			default:
        				result += `<span style="transform: translateY(${Math.sin((i*incrmente+time)*Math.PI)*10}px)">${text[i]}</span>`
        		}
        	};
        	return result
        };
        setInterval(_=>{
            document.getElementById("mypage").innerHTML = wabver("Welcome to my page!!",0.025,performance.now())
        },33)
    </script>
